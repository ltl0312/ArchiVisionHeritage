server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode — serve index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50m;
    }

    # Proxy asset requests to Spring Boot backend (serves uploaded files)
    #
    # 必须用 `^~` 前缀匹配：否则下面那条 `~* \.(js|css|png|jpg|...)$` 正则 location
    # 会优先命中 /assets/xxx.jpg，走 try_files $uri =404 直接 404，
    # 使全部已上传封面在生产环境破图。`^~` 让本前缀匹配胜过正则。
    location ^~ /assets/ {
        proxy_pass http://backend:8080/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets aggressively
    # 构建产物在 /static/**（见 vite.config.js 的 build.assetsDir）；
    # 用户上传文件在 /assets/**，已由上面的 `^~` 前缀 location 接管。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
