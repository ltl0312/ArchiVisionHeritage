server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zhiguan.gujian.auth.domain,com.zhiguan.gujian.task.domain,com.zhiguan.gujian.analysis.domain,com.zhiguan.gujian.community.domain,com.zhiguan.gujian.notification.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.zhiguan.gujian: debug

zhiguan:
  assets:
    local-path: ./test-assets
    url-prefix: /assets

  jwt:
    secret: ${JWT_SECRET:test-secret-key-for-jwt-tests-0123456789abcdef}
    expiration: 86400000

# 测试环境禁用 Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
