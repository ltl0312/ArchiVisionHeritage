server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:zhiguan_gujian}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

zhiguan:
  assets:
    local-path: ${ASSETS_LOCAL_PATH:/app/assets}
    url-prefix: /assets

  jwt:
    secret: ${JWT_SECRET:ZhiGuan-GuJian-2024-SecretKey-For-JWT-Token-Generation-Must-Be-Long-Enough}
    expiration: 86400000

vggt:
  api:
    url: ${VGGT_API_URL:http://vggt-api:8000/v1/analyze}
