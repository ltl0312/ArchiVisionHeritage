server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:zhiguan_gujian}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

zhiguan:
  assets:
    local-path: ${ASSETS_LOCAL_PATH:/app/assets}
    url-prefix: /assets

  # JWT 密钥必须由环境变量注入（与 DB_PASSWORD 同等要求）。
  # 不留默认值 —— 容器部署曾因使用仓库内公开的默认密钥而可被伪造管理员令牌。
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

vggt:
  api:
    url: ${VGGT_API_URL:http://vggt-api:8000/v1/analyze}
