server:
  port: 8080
  tomcat:
    threads:
      max: 200           # 生产级工作线程池上限
      min-spare: 20      # 最小空闲线程保底
    max-connections: 10000  # 最大连接数（高并发护城河）
    accept-count: 200    # 连接队列溢出缓冲

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zhiguan_gujian
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zhiguan.gujian.auth.domain,com.zhiguan.gujian.task.domain,com.zhiguan.gujian.analysis.domain,com.zhiguan.gujian.community.domain,com.zhiguan.gujian.notification.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.zhiguan.gujian: debug

# 本地文件存储路径
zhiguan:
  assets:
    local-path: ./assets
    url-prefix: /assets

  # JWT 密钥与过期时间（生产环境用 JWT_SECRET 环境变量覆盖）
  jwt:
    secret: ${JWT_SECRET:ZhiGuan-GuJian-2024-SecretKey-For-JWT-Token-Generation-Must-Be-Long-Enough}
    expiration: 86400000

  # 幻筑任务 — 模拟耗时 / 资产目录 / 异步线程池参数外置（P2-8）
  task:
    simulate-min-ms: 3000
    simulate-max-ms: 7000
    asset-preview-dir: /assets/preview
    asset-model-dir: /assets/models
    pool:
      core-size: 4
      max-size: 8
      queue-capacity: 100
      name-prefix: zhiguan-async-

# Actuator 健康指标 + Prometheus 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: zhiguan-gujian
  endpoint:
    health:
      show-details: always
